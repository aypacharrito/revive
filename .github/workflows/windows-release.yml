name: Publish signed Windows update
# Publishing to an update channel is an explicit release action, not every commit.
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write
    environment: desktop-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Ensure tag matches package and signing is configured
        shell: pwsh
        env:
          SIGNING_FILE: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag must equal v$version" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_FILE) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw "Configure Windows code signing secrets first; unsigned release updates are blocked."
          }
      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: desktop
        run: npm test
      - name: Create temporary code signing certificate
        shell: pwsh
        env:
          SIGNING_FILE: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/revive-signing.pfx", [Convert]::FromBase64String($env:SIGNING_FILE))
      - name: Build signed NSIS installer and update metadata
        working-directory: desktop
        env:
          CSC_LINK: ${{ runner.temp }}/revive-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: npm run dist:win
      - name: Verify update output
        shell: pwsh
        run: |
          if (!(Test-Path desktop/dist/latest.yml)) { throw 'Missing latest.yml update manifest' }
          if (!(Get-ChildItem desktop/dist/*Setup*.exe -ErrorAction SilentlyContinue)) { throw 'Missing NSIS installer' }
      - name: Publish GitHub Release (owner-controlled)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem desktop/dist/REVIVE-Setup-*.exe,desktop/dist/REVIVE-Setup-*.exe.blockmap | ForEach-Object { $_.FullName })
          $files += (Resolve-Path desktop/dist/latest.yml).Path
          gh release create "$env:GITHUB_REF_NAME" @files --verify-tag --title "REVIVE $env:GITHUB_REF_NAME" --generate-notes
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP/revive-signing.pfx" -ErrorAction SilentlyContinue
